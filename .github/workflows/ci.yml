name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python check_plan.py examples/pass-plan.json
      - run: |
          if python check_plan.py examples/fail-plan.json; then
            exit 1
          else
            test $? -eq 1
          fi
